schemaVersion: 1
catalog:
  id: skill-family-test
  version: "0.2.3"
entries:
  - ref: skill-family-test.plan
    provider:
      scope: plugin
      plugin: skill-family-test
      skill: skill-family-test-plan
    kind: workflow
    summary: "制定有边界的测试方案（不运行被测产品）"
    match:
      domains: [testing]
      artifactTypes: [skill-family]
      intents: [plan]
    accepts:
      - "阶段、变更、业务承诺、既有证据、资产与授权"
    produces:
      - "带停止条件与复用依据的项目测试计划"
    sideEffects:
      - write-project-artifacts
  - ref: skill-family-test.run
    provider:
      scope: plugin
      plugin: skill-family-test
      skill: skill-family-test-run
    kind: workflow
    summary: "组织已授权测试执行、增量复用与收据核收"
    match:
      domains: [testing]
      artifactTypes: [skill-family]
      intents: [run]
    accepts:
      - "已接受方案、被测对象、判据、证据与明确执行授权"
    produces:
      - "绑定摘要的逐项核收收据与原领域判读结果"
    sideEffects:
      - write-project-artifacts
